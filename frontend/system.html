<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - AI Temperature Monitor</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Smart Predictive Maintenance</h2>
                <p>AI-Powered Machine Health Monitoring</p>
            </div>
            <nav>
                <a href="/">Dashboard</a>
                <a href="#">Analytics</a>
                <a href="#">Alerts <span class="badge">10</span></a>
                <a href="/history.html">History</a>
                <a href="/system.html" class="active">System Status</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>System Information</h1>
                    <p>Backend, Database, and ML status</p>
                </div>
            </header>

            <div class="cards-grid">
                <div class="card">
                    <div class="card-title">Backend Status</div>
                    <div class="card-value status-text NORMAL" id="sys-backend">Checking...</div>
                </div>
                <div class="card">
                    <div class="card-title">Database</div>
                    <div class="card-value status-text NORMAL" id="sys-db">Checking...</div>
                </div>
                <div class="card">
                    <div class="card-title">ML Model</div>
                    <div class="card-value" id="sys-ml">Checking...</div>
                </div>
                <div class="card">
                    <div class="card-title">Current Mode</div>
                    <div class="card-value" id="sys-mode">Checking...</div>
                </div>
                <div class="card">
                    <div class="card-title">Arduino Connection</div>
                    <div class="card-value" id="sys-arduino">Checking...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/system.js"></script>
</body>
</html>
